<div class="bg-page min-h-screen flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-sm bg-raised rounded-2xl border border-gray-200 p-8">
    <a routerLink="/" class="brand-logo no-underline block mb-8">
      The<span class="italic text-indigo-700">Blog</span>Sphere
    </a>

    @if (done()) {
      <h1 class="text-auth-title mb-2">Password updated</h1>
      <p class="font-reading text-[1.05rem] text-gray-600 mb-8">
        Your new password is set. Sign in to continue reading and writing.
      </p>
      <a routerLink="/login"
        class="btn-ink btn-press block w-full py-3 text-sm font-semibold rounded-full text-center no-underline">
        Go to sign in
      </a>
    } @else {
      <h1 class="text-auth-title mb-2">Choose a new password</h1>
      <p class="font-reading text-[1.05rem] text-gray-600 mb-8">At least 8 characters. The reset link works once.</p>

      @if (error()) {
        <div class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()" class="space-y-3.5">
        <div class="float-field">
          <input id="reset-password" type="password" [(ngModel)]="password" name="password" required placeholder=" "
            class="w-full px-3.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-clay bg-sunken transition-colors"/>
          <label for="reset-password">New password</label>
        </div>
        <div class="float-field">
          <input id="reset-confirm" type="password" [(ngModel)]="confirm" name="confirm" required placeholder=" "
            class="w-full px-3.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-clay bg-sunken transition-colors"/>
          <label for="reset-confirm">Confirm new password</label>
        </div>
        <button type="submit" [disabled]="loading()"
          class="btn-ink btn-press w-full py-3 text-sm font-semibold rounded-full disabled:opacity-50 disabled:cursor-not-allowed">
          @if (loading()) { Saving&hellip; } @else { Set new password }
        </button>
      </form>
    }
  </div>
</div>
